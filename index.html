<html lang="de">

<style>
/* Layout: one-column phone app, max 480px, content scrolls above a fixed bottom tab bar */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --line:#DFE5E0; --ink:#14201B; --muted:#4A5550;
  --accent:#0B6E4F; --accent-ink:#FFFFFF; --accent-soft:#E1F1E8;
  --hero:#0B3D2E; --hero-ink:#FFFFFF; --hero-muted:#CFE8DC; --hero-track:#1E5544; --hero-bar:#7FD6A8;
  --warn:#9A4A0B; --warn-soft:#FBE9DA; --warn-bar:#D9731F; --danger:#A3261B;
  --font:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17201C; --line:#2A3631; --ink:#E8EEEA; --muted:#A3B0A9;
  --accent:#4CC08F; --accent-ink:#06251A; --accent-soft:#163A2B;
  --hero:#0E2E23; --hero-ink:#FFFFFF; --hero-muted:#B9D9CA; --hero-track:#1F4A3B; --hero-bar:#7FD6A8;
  --warn:#F0A867; --warn-soft:#3A2617; --warn-bar:#E08A3C; --danger:#F08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17201C; --line:#2A3631; --ink:#E8EEEA; --muted:#A3B0A9;
  --accent:#4CC08F; --accent-ink:#06251A; --accent-soft:#163A2B;
  --hero:#0E2E23; --hero-ink:#FFFFFF; --hero-muted:#B9D9CA; --hero-track:#1F4A3B; --hero-bar:#7FD6A8;
  --warn:#F0A867; --warn-soft:#3A2617; --warn-bar:#E08A3C; --danger:#F08A80; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
.hero .muted{color:var(--hero-muted)}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--hero-track);border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:var(--hero-bar);border-radius:4px}
.gauge{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.gauge i{display:block;height:100%;border-radius:7px}
.pill{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{min-height:46px;padding:0 18px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--danger);border:1px solid var(--line)}
.btn.small{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1 1 140px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
label{font-size:13px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
input,select{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);width:100%}
input[type=range]{padding:0;border:none;background:transparent;accent-color:var(--accent)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600}
.tip{display:flex;gap:12px;align-items:flex-start}
.ico{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ico.ok{background:var(--accent-soft);color:var(--accent)} .ico.warn{background:var(--warn-soft);color:var(--warn)} .ico.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.price{font-size:26px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;font-variant-numeric:tabular-nums}.price sup{font-size:14px}
.station{display:flex;justify-content:space-between;align-items:center;gap:12px}
.station .name{font-weight:700;overflow-wrap:anywhere}
.best{border:2px solid var(--accent)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner button{background:none;border:none;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;min-height:32px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.beta{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 8px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
nav.tabs button{min-height:56px;border:none;border-radius:14px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:24px 24px 0 0;max-height:90vh;overflow-y:auto;
  padding:20px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.err{color:var(--danger);font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.mono{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="Hauptmenü" hidden>
  <div class="inner">
    <button data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Start</button>
    <button data-tab="tanken"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v17M2 22h13M14 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3M6 8h5"/></svg>Tanken</button>
    <button data-tab="wunsch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg>Wunschliste</button>
    <button data-tab="mehr"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Mehr</button>
  </div>
</nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
// ===== Einstellungen =====
const FEEDBACK_EMAIL = 'feedback@fastumsonst.de'; // <- deine echte Feedback-Adresse hier eintragen
const API_URL = '/api/stations';                  // Server-Funktion für echte Tankpreise
const VERSION = 'Beta 0.1';
const KEY = 'fastumsonst-v1';
const FUELS = {e5:'Super E5', e10:'Super E10', diesel:'Diesel'};

// ===== Daten speichern (nur auf diesem Gerät) =====
function defaults(){ return {setup:{tankL:50, cons:6.5, weekKm:250, fuel:'e10', done:false}, tank:null, fills:[], wishes:[], demo:false}; }
function load(){ try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); return Object.assign(defaults(), d, {setup:Object.assign(defaults().setup, d.setup||{})}); } }catch(e){} return defaults(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();
let tab = 'home', stations = [], source = '', loading = false, resetArmed = false, installEvt = null;

// ===== Helfer =====
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n || 0);
const num = (n,d=0) => new Intl.NumberFormat('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n || 0);
const parse = v => { const n = parseFloat(String(v ?? '').trim().replace(/\./g,'').replace(',','.')); return isFinite(n) ? n : NaN; };
const parsePrice = v => { const n = parseFloat(String(v ?? '').trim().replace(',','.')); return isFinite(n) ? n : NaN; };
const priceHtml = p => { const s = p.toFixed(3); return s.slice(0,4).replace('.',',') + '<sup>' + s.slice(4) + '</sup>'; };
const uid = () => Math.random().toString(36).slice(2,10);
const thisMonth = t => { const d = new Date(t), n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); };
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

const I = {
  pump:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v17M2 22h13M14 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3M6 8h5"/></svg>',
  clock:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  tag:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  refresh:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>'
};

// ===== Tank-Schätzung =====
function tankNow(){
  if(!S.tank) return null;
  const days = Math.max(0, (Date.now() - S.tank.at) / 864e5);
  const km = days * S.setup.weekKm / 7;
  const liters = Math.max(0, S.tank.liters - km * S.setup.cons / 100);
  return {liters, pct: Math.min(100, liters / S.setup.tankL * 100), reach: liters / S.setup.cons * 100};
}
function learnWeekKm(newOdo){
  if(!S.tank || !S.tank.odo || !(newOdo > S.tank.odo)) return;
  const days = (Date.now() - S.tank.at) / 864e5;
  if(days < 1) return;
  const perWeek = (newOdo - S.tank.odo) / days * 7;
  if(perWeek > 5 && perWeek < 5000) S.setup.weekKm = Math.round(S.setup.weekKm * 0.6 + perWeek * 0.4);
}

// ===== Tankstellen =====
function getPos(){
  return new Promise((ok, fail) => {
    if(!navigator.geolocation) return fail(new Error('kein GPS'));
    navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lng:p.coords.longitude}), fail, {timeout:8000, maximumAge:300000});
  });
}
function demoStations(){
  const h = new Date().getHours();
  const shift = (h >= 18 && h < 22) ? -0.05 : (h >= 6 && h < 10) ? 0.04 : 0;
  const rows = [
    ['Tankstelle am Ring','Ringstraße 12',0.8,1.749,1.689,1.599],
    ['Freie Tankstelle Süd','Südring 3',1.4,1.769,1.709,1.619],
    ['Autohof West','Industriestraße 40',2.1,1.789,1.729,1.649],
    ['Tankstelle Bahnhof','Bahnhofstraße 7',0.5,1.819,1.759,1.669],
    ['Tankstelle Nord','Nordallee 21',3.2,1.799,1.739,1.629]
  ];
  return rows.map((r,i) => ({id:'demo'+i, name:r[0], addr:r[1], dist:r[2], isOpen:true, e5:+(r[3]+shift).toFixed(3), e10:+(r[4]+shift).toFixed(3), diesel:+(r[5]+shift).toFixed(3)}));
}
async function loadStations(){
  loading = true; render();
  try{
    const pos = await getPos();
    const r = await fetch(API_URL + '?lat=' + pos.lat.toFixed(3) + '&lng=' + pos.lng.toFixed(3) + '&rad=5');
    if(!r.ok) throw new Error('api');
    const j = await r.json();
    if(!j.ok || !Array.isArray(j.stations) || !j.stations.length) throw new Error('leer');
    stations = j.stations.map(s => ({
      id:s.id, name:(s.brand ? s.brand + ' ' : '') + (s.street ? s.street : s.name || 'Tankstelle'),
      addr:[(s.street||'') + ' ' + (s.houseNumber||''), s.place||''].filter(x => x.trim()).join(', '),
      dist:s.dist, isOpen:s.isOpen, e5:s.e5, e10:s.e10, diesel:s.diesel
    }));
    source = 'live';
  }catch(e){
    stations = demoStations(); source = 'demo';
  }
  loading = false; render();
}
function fuelList(){
  const f = S.setup.fuel;
  const list = stations.filter(s => s.isOpen && typeof s[f] === 'number' && s[f] > 0).sort((a,b) => a[f] - b[f]);
  const avg = list.length ? list.reduce((a,s) => a + s[f], 0) / list.length : null;
  return {list, avg, f};
}
function timeHint(){
  const h = new Date().getHours();
  if(h >= 18 && h < 22) return {good:true, title:'Jetzt ist eine gute Zeit', text:'Am frühen Abend sind die Spritpreise meist am niedrigsten.'};
  if(h >= 6 && h < 12) return {good:false, title:'Wenn es nicht eilt: heute Abend tanken', text:'Morgens sind die Preise meist am höchsten. Ab etwa 18 Uhr wird es in der Regel günstiger.'};
  if(h >= 12 && h < 18) return {good:false, title:'Lieber bis zum Abend warten', text:'Ab etwa 18 Uhr sinken die Preise meist. Wenn dein Tank reicht, lohnt sich das Warten.'};
  return {good:false, title:'Faustregel: früher Abend', text:'Nachts und am Morgen steigen die Preise oft. Am günstigsten ist es meist zwischen 18 und 22 Uhr.'};
}

// ===== Gespart =====
function savings(){
  const fuel = S.fills.filter(f => thisMonth(f.at)).reduce((a,f) => a + (f.saved||0), 0);
  const wish = S.wishes.filter(w => w.bought && thisMonth(w.boughtAt)).reduce((a,w) => a + (w.saved||0), 0);
  const all = S.fills.reduce((a,f) => a + (f.saved||0), 0) + S.wishes.filter(w => w.bought).reduce((a,w) => a + (w.saved||0), 0);
  return {fuel, wish, total: fuel + wish, all};
}
function wishStatus(w){
  if(w.bought) return {cls:'ok', text: w.saved > 0 ? 'Gekauft · ' + eur(w.saved) + ' gespart' : 'Gekauft'};
  if(w.now <= w.target) return {cls:'ok', text:'Zielpreis erreicht – jetzt kaufen'};
  if(w.now < w.start) return {cls:'warn', text:'Schon ' + eur(w.start - w.now) + ' günstiger · noch ' + eur(w.now - w.target) + ' bis zum Ziel'};
  return {cls:'neutral', text:'Noch ' + eur(w.now - w.target) + ' über deinem Zielpreis'};
}

// ===== Ansichten =====
function demoBanner(){
  return S.demo ? '<div class="banner"><span>Du siehst Beispieldaten.</span><button data-action="clear-demo">Mit eigenen Daten starten</button></div>' : '';
}
function header(title, sub){
  return '<div class="stack" style="gap:4px"><h1>' + title + '</h1>' + (sub ? '<p class="muted">' + sub + '</p>' : '') + '</div>';
}
function viewSetup(){
  const s = S.setup;
  return '<div class="brand"><div class="logo" aria-hidden="true">€</div><div><h1>FastUmsonst</h1></div><span class="beta">BETA</span></div>' +
  '<div class="hero"><p style="font-size:20px;font-weight:800;line-height:1.3">Dein Spar-Assistent fürs Tanken und Einkaufen.</p>' +
  '<p class="muted">Die App zeigt dir die günstigste Tankstelle in deiner Nähe, rechnet mit, wann dein Tank leer wird, und behält die Preise auf deiner Wunschliste im Blick.</p></div>' +

    {at:t2, station:'Freie Tankstelle Süd', price:1.699, liters:38.5, avg:1.744, saved:+((1.744-1.699)*38.5).toFixed(2), full:true, odo:84110}
  ];

// ===== Rendern =====
function render(){
  const app = $('app');
  if(!S.setup.done){ app.innerHTML = viewSetup(); $('tabs').hidden = true; return; }
  $('tabs').hidden = false;
  app.innerHTML = tab === 'home' ? viewHome() : tab === 'tanken' ? viewTanken() : tab === 'wunsch' ? viewWunsch() : viewMehr();
  document.querySelectorAll('#tabs button').forEach(b => { if(b.dataset.tab === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const r = $('t-init'); if(r) r.addEventListener('input', () => $('t-init-out').textContent = r.value + ' %');
}
function readProfile(prefix, errId){
  const tankL = parse($(prefix+'-tank').value), cons = parsePrice($(prefix+'-cons').value), week = parse($(prefix+'-week').value), fuel = $(prefix+'-fuel').value;
  if(!(tankL >= 10 && tankL <= 200)) return showErr(errId, 'Bitte eine Tankgröße zwischen 10 und 200 Litern eingeben.'), null;
  if(!(cons >= 2 && cons <= 30)) return showErr(errId, 'Bitte einen Verbrauch zwischen 2 und 30 Litern eingeben.'), null;
  if(!(week >= 0 && week <= 5000)) return showErr(errId, 'Bitte die Kilometer pro Woche als Zahl eingeben.'), null;
  return {tankL, cons, weekKm:week, fuel};
}

// ===== Ereignisse =====
document.addEventListener('click', e => {
  const tb = e.target.closest('#tabs button');
  if(tb){ tab = tb.dataset.tab; resetArmed = false; render(); window.scrollTo(0,0); if(tab === 'tanken' && !stations.length) loadStations(); return; }
  const a = e.target.closest('[data-action]'); if(!a) return;
  const act = a.dataset.action;
  if(act === 'sheet-bg' && e.target !== a) return;
  switch(act){
    case 'demo': loadDemo(); loadStations(); break;
    case 'clear-demo': S = defaults(); save(); render(); break;
    case 'go': tab = a.dataset.go; render(); window.scrollTo(0,0); if(tab === 'tanken' && !stations.length) loadStations(); break;
    case 'fuel': S.setup.fuel = a.dataset.fuel; save(); render(); break;
    case 'reload': loadStations(); break;
    case 'tank-init': { const v = +$('t-init').value; S.tank = {liters: S.setup.tankL * v / 100, at: Date.now(), odo: null}; save(); render(); toast('Füllstand gespeichert'); break; }
    case 'fill': fillSheet(a.dataset.station); break;
    case 'odo': odoSheet(); break;
    case 'sheet-close': case 'sheet-bg': closeSheet(); break;
    case 'wish-price': { const w = S.wishes.find(x => x.id === a.dataset.id); const v = parsePrice($('p-' + w.id).value); if(!(v > 0)) { toast('Bitte einen Preis eingeben'); break; } w.now = v; save(); render(); toast(v <= w.target ? 'Zielpreis erreicht!' : 'Preis aktualisiert'); break; }
    case 'wish-buy': { const w = S.wishes.find(x => x.id === a.dataset.id); w.bought = true; w.boughtAt = Date.now(); w.saved = Math.max(0, +(w.start - w.now).toFixed(2)); save(); render(); toast(w.saved > 0 ? eur(w.saved) + ' gespart!' : 'Als gekauft markiert'); break; }
    case 'wish-del': S.wishes = S.wishes.filter(x => x.id !== a.dataset.id); save(); render(); break;
    case 'copy-mail': navigator.clipboard && navigator.clipboard.writeText(FEEDBACK_EMAIL).then(() => toast('Adresse kopiert'), () => toast('Bitte die Adresse markieren und kopieren')); break;
    case 'install': if(installEvt){ installEvt.prompt(); installEvt = null; render(); } break;
    case 'reset': resetArmed = true; render(); break;
    case 'reset-no': resetArmed = false; render(); break;
    case 'reset-yes': S = defaults(); save(); resetArmed = false; tab = 'home'; render(); toast('Daten gelöscht'); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if(id === 'setup-form'){
    const p = readProfile('s', 'setup-err'); if(!p) return;
    Object.assign(S.setup, p, {done:true}); save(); tab = 'tanken'; render(); loadStations();
  }
  if(id === 'profile-form'){
    const p = readProfile('m', 'profile-err'); if(!p) return;
    Object.assign(S.setup, p); save(); render(); toast('Gespeichert');
  }
  if(id === 'wish-form'){
    const name = $('w-name').value.trim(), now = parsePrice($('w-now').value), target = parsePrice($('w-target').value);
    if(!name) return showErr('wish-err', 'Bitte gib ein, was du kaufen möchtest.');
    if(!(now > 0) || !(target > 0)) return showErr('wish-err', 'Bitte aktuellen Preis und Wunschpreis als Zahl eingeben, z. B. 149,99.');
    S.wishes.unshift({id:uid(), name, start:now, now, target, bought:false}); save(); render(); toast('Zur Wunschliste hinzugefügt');
  }
  if(id === 'fill-form'){
    const liters = parsePrice($('f-l').value), price = parsePrice($('f-p').value), odoRaw = $('f-o').value.trim(), odo = odoRaw ? parse(odoRaw) : null, full = $('f-full').checked;
    if(!(liters > 0 && liters <= 300)) return showErr('fill-err', 'Bitte die getankten Liter eingeben, z. B. 42,5.');
    if(!(price > 0.5 && price < 5)) return showErr('fill-err', 'Bitte den Preis pro Liter eingeben, z. B. 1,689.');
    if(odoRaw && !(odo > 0)) return showErr('fill-err', 'Der Kilometerstand muss eine Zahl sein.');
    const avg = (sheetCtx && sheetCtx.avg) || fuelList().avg;
    const saved = avg ? Math.max(0, +((avg - price) * liters).toFixed(2)) : 0;
    if(full && odo){
      const last = [...S.fills].reverse().find(x => x.full && x.odo);
      if(last && odo > last.odo + 50){ const c = liters / (odo - last.odo) * 100; if(c > 2 && c < 25) S.setup.cons = Math.round((S.setup.cons * 0.5 + c * 0.5) * 10) / 10; }
    }
    if(odo) learnWeekKm(odo);
    const before = tankNow();
    const newL = full ? S.setup.tankL : Math.min(S.setup.tankL, (before ? before.liters : 0) + liters);
    S.tank = {liters:newL, at:Date.now(), odo: odo || (S.tank && S.tank.odo) || null};
    S.fills.push({at:Date.now(), station:(sheetCtx && sheetCtx.station) || null, price, liters, avg:avg || null, saved, full, odo});
    save(); closeSheet(); render(); toast(saved > 0 ? eur(saved) + ' gespart gegenüber dem Durchschnitt' : 'Tankfüllung gespeichert');
  }
  if(id === 'odo-form'){
    const odo = parse($('o-v').value);
    if(!(odo > 0)) return showErr('odo-err', 'Bitte den Kilometerstand als Zahl eingeben.');
    const t = tankNow();
    if(S.tank && S.tank.odo){
      if(odo < S.tank.odo) return showErr('odo-err', 'Der Wert ist kleiner als der letzte Kilometerstand (' + num(S.tank.odo) + ').');
      const driven = odo - S.tank.odo;
      learnWeekKm(odo);
      S.tank = {liters: Math.max(0, S.tank.liters - driven * S.setup.cons / 100), at: Date.now(), odo};
    } else {
      S.tank = {liters: t ? t.liters : S.setup.tankL / 2, at: Date.now(), odo};
    }
    save(); closeSheet(); render(); toast('Kilometerstand gespeichert');
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(tab === 'mehr') render(); });
if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(() => {}); }

render();
if(S.setup.done) loadStations();
})();
</script>
