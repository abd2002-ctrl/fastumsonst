name: transcribe
on:
  push:
    branches: [video-assets]
    paths: [tr/go.txt]
permissions:
  contents: write
jobs:
  tr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q faster-whisper
      - run: |
          python - <<'PY'
          import json, glob, os
          from faster_whisper import WhisperModel
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          out = {}
          for f in sorted(glob.glob("tr/*.wav")):
              segs, info = m.transcribe(f, language="de", word_timestamps=True, beam_size=5)
              words = []
              text = ""
              for s in segs:
                  text += s.text
                  for w in s.words: words.append([w.word.strip(), round(w.start,3), round(w.end,3), round(w.probability,3)])
              out[os.path.basename(f)] = {"text": text.strip(), "words": words}
          json.dump(out, open("tr/result.json","w"), ensure_ascii=False, indent=1)
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tr/result.json
          git commit -m "Transkript" || true
          git push
