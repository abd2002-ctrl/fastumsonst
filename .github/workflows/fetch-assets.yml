name: fetch-assets
on:
  push:
    branches: [video-assets]
    paths: [assets/files.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd assets
          while read f; do [ -n "$f" ] && curl -fsS -o "$f" "https://d8j0ntlcm91z4.cloudfront.net/user_3KgE92ztvLsVqdQHuo5XelGkY1Y/$f" || echo "fail $f"; done < files.txt
          ls | wc -l
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets
          git commit -m "Bilder geladen" || true
          git push
